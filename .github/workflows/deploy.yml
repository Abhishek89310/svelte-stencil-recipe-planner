# Builds the SvelteKit application and publishes it to GitHub Pages.
#
# The Stencil component library is installed from npm like any other dependency,
# so this workflow only ever builds `recipe-app/`.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a deploy to be triggered by hand from the Actions tab.
  workflow_dispatch:

# Allow the workflow to publish to Pages using the repository's OIDC identity,
# so no personal access token is involved.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys run at once, but let a newer commit supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipe-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recipe-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        # A project site is served from /<repo>/, so the app is told its base path.
        # `${{ github.event.repository.name }}` keeps this correct if the repo is renamed.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: recipe-app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
